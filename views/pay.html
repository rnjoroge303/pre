<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay</title>
    <style>
        :root {
            color-scheme: light;
            --pink: #e83e8c;
            --pink-dark: #c92f75;
            --pink-light: #fff0f6;
            --text: #54283d;
            --muted: #936c7e;
            --white: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 15%, #ffffff 0 7%, transparent 28%),
                radial-gradient(circle at 90% 85%, #ffd4e5 0 8%, transparent 30%),
                linear-gradient(135deg, #fff5f9, #f8d7e5);
        }

        .payinfo {
            width: min(100%, 760px);
            padding: clamp(24px, 5vw, 44px);
            border: 1px solid rgba(232, 62, 140, 0.13);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 24px 70px rgba(139, 43, 87, 0.16);
            animation: rise-in 700ms cubic-bezier(.2, .75, .25, 1) both;
            backdrop-filter: blur(12px);
        }

        h3 {
            margin: 0 0 28px;
            color: var(--pink-dark);
            font-size: clamp(1.7rem, 4vw, 2.2rem);
            letter-spacing: -0.04em;
            text-align: center;
        }

        .addrs,
        .recipt,
        .payout {
            margin-top: 18px;
            padding: clamp(20px, 4vw, 28px);
            border: 1px solid #f5d6e3;
            border-radius: 20px;
            background: linear-gradient(145deg, #fff, #fff8fb);
            box-shadow: 0 8px 22px rgba(165, 68, 109, 0.07);
            animation: fade-up 650ms ease both;
            transition: transform 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
        }

        .addrs {
            animation-delay: 100ms;
        }

        .recipt {
            animation-delay: 200ms;
        }

        .payout {
            animation-delay: 300ms;
        }

        .addrs:hover,
        .recipt:hover,
        .payout:hover {
            transform: translateY(-3px);
            border-color: #efb4ce;
            box-shadow: 0 14px 30px rgba(165, 68, 109, 0.12);
        }

        .addrs>p,
        .recipt>p,
        .payout>p {
            margin: 0 0 18px;
            color: var(--pink-dark);
            font-size: 1.08rem;
            font-weight: 700;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            gap: 8px;
            color: var(--text);
            font-size: 0.94rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 46px;
            padding: 11px 14px;
            border: 1px solid #ebd3dd;
            border-radius: 12px;
            outline: none;
            background: var(--white);
            color: var(--text);
            font: inherit;
            transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
        }

        input::placeholder {
            color: #b89aa8;
        }

        input:focus {
            border-color: var(--pink);
            background: #fffafd;
            box-shadow: 0 0 0 4px rgba(232, 62, 140, 0.13);
        }

        input:disabled {
            border-color: #f2e1e8;
            background: #fff3f8;
            color: var(--pink-dark);
            font-weight: 700;
            opacity: 1;
        }

        button {
            justify-self: start;
            min-height: 46px;
            padding: 0 24px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, #f36ba7, var(--pink-dark));
            box-shadow: 0 8px 18px rgba(201, 47, 117, 0.24);
            color: var(--white);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(201, 47, 117, 0.32);
            filter: saturate(1.1);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        button:focus-visible {
            outline: 3px solid #f5a8c8;
            outline-offset: 3px;
        }

        .mpesa {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
            padding: 14px 16px;
            border: 1px solid #f6d5e2;
            border-radius: 14px;
            background: var(--pink-light);
        }

        .mpesa img {
            width: 52px;
            height: 42px;
            border-radius: 9px;
            object-fit: contain;
            color: var(--pink-dark);
            font-size: 0.7rem;
        }

        .mpesa p {
            margin: 0;
            color: var(--muted);
        }

        .payout label>p {
            margin: 2px 0;
            color: var(--muted);
            font-weight: 500;
        }

        .payout label>p input {
            margin-top: 6px;
        }

        .payout label>p:nth-of-type(2) {
            color: var(--pink);
            font-weight: 700;
        }

        .payout button {
            justify-self: stretch;
            margin-top: 4px;
        }

        [hidden] {
            display: none !important;
        }

        .receipt-summary {
            margin: 0 0 20px;
            padding: 16px;
            border-radius: 12px;
            background: var(--pink-light);
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .payment-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(67, 25, 45, 0.48);
            backdrop-filter: blur(5px);
        }

        .payment-dialog {
            width: min(100%, 440px);
            padding: 32px;
            border: 1px solid #f5d6e3;
            border-radius: 24px;
            background: var(--white);
            box-shadow: 0 24px 70px rgba(67, 25, 45, 0.25);
            text-align: center;
            animation: rise-in 350ms ease both;
        }

        .payment-dialog h2 {
            margin: 0 0 12px;
            color: var(--pink-dark);
            font-size: 1.45rem;
        }

        .payment-dialog p {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.6;
        }

        .payment-spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 20px;
            border: 4px solid #f9d9e7;
            border-top-color: var(--pink);
            border-radius: 50%;
            animation: spin 850ms linear infinite;
        }

        .payment-dialog .dialog-button {
            justify-self: auto;
        }

        .payment-dialog .cancel-button {
            margin: 12px 0 0;
            padding: 0 16px;
            border: 1px solid #efb4ce;
            background: var(--white);
            box-shadow: none;
            color: var(--pink-dark);
        }

        .payment-dialog .cancel-button:hover {
            background: var(--pink-light);
            box-shadow: 0 6px 14px rgba(201, 47, 117, 0.12);
        }

        .mpesa-code-form {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f5d6e3;
            text-align: left;
        }

        .mpesa-code-form label {
            margin-bottom: 12px;
        }

        .mpesa-code-form button {
            width: 100%;
            justify-self: stretch;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rise-in {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fade-up {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 24px 14px;
            }

            .payinfo {
                border-radius: 22px;
            }

            .addrs,
            .recipt,
            .payout {
                border-radius: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="payinfo">
        <h3>Payment Form</h3>

        <div class="addrs">
            <p>Shipping Details:</p>
            <form id="shipping-form">
                <label for="Rname">TO:
                    <input type="text" name="rno" id="Rname" placeholder="Name...">
                </label>
                <label for="Rno">Phone Number:
                    <input type="tel" name="rno" id="Rno" placeholder="Phone Number...">
                </label>
                <label for="lc">Location:
                    <input type="text" name="lco" id="lc" placeholder="Parcel Drop Off">
                </label>
                <button type="submit">Next</button>
            </form>
        </div>
        <div class="recipt" hidden>
            <p>recipt confirmation:</p>
            <div class="receipt-summary" id="receipt-summary"></div>
            <button type="button" id="receipt-next">Next</button>

        </div>
        <div class="payout" hidden>
            <P>Payment:</P>
            <div class="mpesa">
                <img src="#" alt="M-pesa Logo" srcset="">
                <p>Please confirm Payment Details></p>
            </div>
            <form id="payment-form">
                <label for="pno">Paying Phone No:
                    <input type="tel" id="pno" placeholder="0712345678">
                </label>
                <label for="amount">Amount To Be Paid:
                    <p aria-disabled="true">Total Amount: <input id="total-amount" type="text" disabled readonly
                            value="20"></p>
                    <p aria-disabled="true">Shipping Fees: <input id="shipping-fee" type="text" disabled readonly
                            value="0"></p>
                </label>
                <input type="hidden" id="user-id" value="67890">
                <input type="hidden" id="product-id" value="54321">
                <input type="hidden" id="quantity" value="2">
                <button type="submit" id="pay-button">Pay Now</button>
            </form>
        </div>
    </div>

    <div class="payment-overlay" id="payment-overlay" role="dialog" aria-modal="true"
        aria-labelledby="payment-status-title" aria-describedby="payment-status-message" hidden>
        <div class="payment-dialog" aria-live="polite">
            <div class="payment-spinner" id="payment-spinner" aria-hidden="true"></div>
            <h2 id="payment-status-title">Waiting for payment</h2>
            <p id="payment-status-message">Complete the payment on your phone. We’ll wait up to 1 minute for
                confirmation.</p>
            <form class="mpesa-code-form" id="mpesa-code-form" hidden>
                <label for="mpesa-code">Didn't receive automatic confirmation? Enter your M-Pesa code:
                    <input type="text" id="mpesa-code" name="mpesaCode" placeholder="e.g. QWE123ABC" autocomplete="off">
                </label>
                <button type="submit">Submit code for verification</button>
            </form>
            <button class="dialog-button" id="payment-dialog-button" type="button" hidden>Return to payment</button>
            <button class="cancel-button" id="cancel-payment-button" type="button">Cancel payment</button>
        </div>
    </div>

    <script>
        const shippingForm = document.querySelector("#shipping-form");
        const shippingStep = document.querySelector(".addrs");
        const receiptStep = document.querySelector(".recipt");
        const paymentStep = document.querySelector(".payout");
        const receiptSummary = document.querySelector("#receipt-summary");
        const paymentForm = document.querySelector("#payment-form");
        const payButton = document.querySelector("#pay-button");
        const paymentOverlay = document.querySelector("#payment-overlay");
        const paymentTitle = document.querySelector("#payment-status-title");
        const paymentMessage = document.querySelector("#payment-status-message");
        const paymentSpinner = document.querySelector("#payment-spinner");
        const dialogButton = document.querySelector("#payment-dialog-button");
        const cancelPaymentButton = document.querySelector("#cancel-payment-button");
        const mpesaCodeForm = document.querySelector("#mpesa-code-form");
        const mpesaCodeInput = document.querySelector("#mpesa-code");
        let paymentTimeout;
        let paymentPollInterval;
        let activeCheckoutRequestId = null;

        const showFieldError = (input, message) => {
            input.setCustomValidity(message);
            input.reportValidity();
            input.setCustomValidity("");
        };

        const clearFieldErrors = (form) => {
            form.querySelectorAll("input").forEach((input) => input.setCustomValidity(""));
        };

        const validateShippingForm = () => {
            clearFieldErrors(shippingForm);
            const nameInput = document.querySelector("#Rname");
            const shippingPhoneInput = document.querySelector("#Rno");
            const locationInput = document.querySelector("#lc");

            if (!nameInput.value.trim()) {
                showFieldError(nameInput, "Please enter the recipient name.");
                return false;
            }

            if (!/^\+?[0-9 ()-]{7,20}$/.test(shippingPhoneInput.value.trim())) {
                showFieldError(shippingPhoneInput, "Please enter a valid shipping phone number.");
                return false;
            }

            if (!locationInput.value.trim()) {
                showFieldError(locationInput, "Please enter the parcel drop-off location.");
                return false;
            }

            return true;
        };

        const validatePaymentForm = () => {
            clearFieldErrors(paymentForm);
            const paymentPhoneInput = document.querySelector("#pno");

            if (!/^\+?[0-9 ()-]{7,20}$/.test(paymentPhoneInput.value.trim())) {
                showFieldError(paymentPhoneInput, "Please enter a valid M-Pesa phone number.");
                return false;
            }
            return true;
        };

        shippingForm.addEventListener("submit", (event) => {
            event.preventDefault();
            if (!validateShippingForm()) return;

            receiptSummary.textContent = `Recipient: ${document.querySelector("#Rname").value.trim()} · Phone: ${document.querySelector("#Rno").value.trim()} · Location: ${document.querySelector("#lc").value.trim()}`;
            shippingStep.hidden = true;
            receiptStep.hidden = false;
            receiptStep.scrollIntoView({ behavior: "smooth", block: "center" });
        });

        document.querySelector("#receipt-next").addEventListener("click", () => {
            receiptStep.hidden = true;
            paymentStep.hidden = false;
            paymentStep.scrollIntoView({ behavior: "smooth", block: "center" });
        });

        paymentForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (!validatePaymentForm()) return;

            window.clearInterval(paymentPollInterval);
            window.clearTimeout(paymentTimeout);
            activeCheckoutRequestId = null;

            paymentOverlay.hidden = false;
            paymentTitle.textContent = "Processing payment";
            paymentMessage.textContent = "Creating the order and recording the payment request...";
            paymentSpinner.hidden = false;
            dialogButton.hidden = true;
            cancelPaymentButton.hidden = false;
            mpesaCodeForm.hidden = true;
            payButton.disabled = true;

            try {
                const shippingData = {
                    recipientName: document.querySelector("#Rname").value.trim(),
                    shippingPhone: document.querySelector("#Rno").value.trim(),
                    location: document.querySelector("#lc").value.trim()
                };
                const paymentPhone = document.querySelector("#pno").value.trim();
                const totalAmount = Number(document.querySelector("#total-amount").value)
                    + Number(document.querySelector("#shipping-fee").value);
                const userId = Number(document.querySelector("#user-id").value);
                const productId = Number(document.querySelector("#product-id").value);
                const quantity = Number(document.querySelector("#quantity").value);

                const orderResponse = await fetch("/api/orders", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user_id: userId,
                        product_id: productId,
                        quantity: quantity,
                        total_price: totalAmount,
                        recipient_name: shippingData.recipientName,
                        shipping_phone: shippingData.shippingPhone,
                        shipping_location: shippingData.location
                    })
                });

                if (!orderResponse.ok) {
                    const response = await orderResponse.json().catch(() => ({}));
                    throw new Error(response.error || "Order could not be created");
                }
                const order = await orderResponse.json();

                const paymentResponse = await fetch("/api/payments", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        userId: userId,
                        orderId: order.orderId,
                        amount: totalAmount,
                        paymentMethod: "M-pesa",
                        phoneNumber: paymentPhone,
                        shippingPhone: shippingData.shippingPhone,
                        recipientName: shippingData.recipientName,
                        shippingLocation: shippingData.location
                    })
                });

                if (!paymentResponse.ok) {
                    const response = await paymentResponse.json().catch(() => ({}));
                    throw new Error(response.error || "Payment could not be recorded");
                }

                const paymentResult = await paymentResponse.json();
                const checkoutRequestId = paymentResult.checkoutRequestId;
                activeCheckoutRequestId = checkoutRequestId;

                paymentTitle.textContent = "Waiting for payment";
                paymentMessage.textContent = "Complete the payment on your phone. We’ll wait up to 1 minute for confirmation.";

                paymentPollInterval = window.setInterval(async () => {
                    if (activeCheckoutRequestId !== checkoutRequestId) return;
                    try {
                        const statusResponse = await fetch(`/api/mpesa/status/${encodeURIComponent(checkoutRequestId)}`);
                        if (!statusResponse.ok) return;

                        const status = await statusResponse.json();
                        if (activeCheckoutRequestId !== checkoutRequestId) return;
                        if (status.status === "confirmed") {
                            window.clearInterval(paymentPollInterval);
                            window.clearTimeout(paymentTimeout);
                            window.confirmPaymentReceived(checkoutRequestId);
                        } else if (status.status === "failed" || status.status === "cancelled") {
                            window.clearInterval(paymentPollInterval);
                            window.clearTimeout(paymentTimeout);
                            paymentTitle.textContent = status.status === "cancelled"
                                ? "Payment cancelled"
                                : "Payment failed";
                            paymentMessage.textContent = status.resultDescription || "The M-Pesa transaction was not completed.";
                            paymentSpinner.hidden = true;
                            mpesaCodeForm.hidden = true;
                            dialogButton.textContent = "Return to payment";
                            dialogButton.hidden = false;
                            cancelPaymentButton.hidden = true;
                            payButton.disabled = false;
                        }
                    } catch (error) {
                        console.error("Could not check M-Pesa status", error);
                    }
                }, 2500);

                paymentTimeout = window.setTimeout(() => {
                    window.clearInterval(paymentPollInterval);
                    paymentTitle.textContent = "Still waiting for confirmation";
                    paymentMessage.textContent = "Automatic confirmation hasn't arrived. You can enter your M-Pesa transaction code below for verification.";
                    paymentSpinner.hidden = true;
                    mpesaCodeForm.hidden = false;
                    payButton.disabled = false;
                }, 60000);
            } catch (error) {
                paymentTitle.textContent = "Request failed";
                paymentMessage.textContent = error.message;
                paymentSpinner.hidden = true;
                payButton.disabled = false;
            }
        });

        mpesaCodeForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const code = mpesaCodeInput.value.trim();
            if (!/^[A-Z0-9]{8,12}$/i.test(code)) {
                showFieldError(mpesaCodeInput, "Please enter a valid M-Pesa transaction code.");
                return;
            }

            const codeSubmitButton = mpesaCodeForm.querySelector("button[type='submit']");
            codeSubmitButton.disabled = true;
            paymentTitle.textContent = "Verifying M-Pesa code";
            paymentMessage.textContent = "Please wait while the transaction code is checked.";
            paymentSpinner.hidden = false;

            try {
                const verified = await window.verifyMpesaCode(code);
                if (verified) {
                    window.confirmPaymentReceived();
                } else {
                    paymentTitle.textContent = "Code not confirmed";
                    paymentMessage.textContent = "The payment provider did not confirm this code. Check it and try again.";
                    paymentSpinner.hidden = true;
                    codeSubmitButton.disabled = false;
                }
            } catch {
                paymentTitle.textContent = "Could not verify code";
                paymentMessage.textContent = "Verification failed. Check your connection or payment status and try again.";
                paymentSpinner.hidden = true;
                codeSubmitButton.disabled = false;
            }
        });

        dialogButton.addEventListener("click", () => {
            paymentOverlay.hidden = true;
            paymentStep.scrollIntoView({ behavior: "smooth", block: "center" });
        });

        cancelPaymentButton.addEventListener("click", () => {
            window.clearInterval(paymentPollInterval);
            window.clearTimeout(paymentTimeout);
            activeCheckoutRequestId = null;
            paymentOverlay.hidden = true;
            mpesaCodeForm.hidden = true;
            mpesaCodeForm.reset();
            mpesaCodeForm.querySelector("button[type='submit']").disabled = false;
            dialogButton.hidden = true;
            payButton.disabled = false;
            paymentStep.scrollIntoView({ behavior: "smooth", block: "center" });
        });

        // Call this only after your payment provider verifies the transaction.
        window.confirmPaymentReceived = (checkoutRequestId) => {
            window.clearInterval(paymentPollInterval);
            window.clearTimeout(paymentTimeout);
            paymentTitle.textContent = "Payment received";
            paymentMessage.textContent = "Your payment is confirmed. Opening the receipt...";
            paymentSpinner.hidden = false;
            mpesaCodeForm.hidden = true;
            dialogButton.hidden = true;
            cancelPaymentButton.hidden = true;
            window.setTimeout(() => window.location.href = `/receipt/${encodeURIComponent(checkoutRequestId)}`, 3000);
        };
    </script>
</body>

</html>
